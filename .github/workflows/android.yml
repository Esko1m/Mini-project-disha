name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"
      EXPO_PUBLIC_SUPABASE_URL: "https://lxxjwdklshldjlgcsqwr.supabase.co"
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_xAhcz4fc5FMYoeMU5NC5eQ_fy3hXTDJ"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          if ! sdkmanager "ndk;27.1.12297006" "cmake;3.22.1" >/tmp/sdk.log 2>&1; then
            msg=$(tail -n 30 /tmp/sdk.log | tr '\n' ' ')
            echo "::error::Android SDK package install failed: $msg"
            exit 1
          fi
          ls "$ANDROID_HOME/ndk"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if ! ./gradlew assembleRelease --no-daemon \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=false >/tmp/gradle.log 2>&1; then
            echo "::error::Gradle build failed: $(tail -n 50 /tmp/gradle.log | tr '\n' ' ')"
            tail -n 200 /tmp/gradle.log
            exit 1
          fi
          tail -n 30 /tmp/gradle.log

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/Disha-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Disha-release-apk
          path: artifacts/Disha-release.apk
          if-no-files-found: error
